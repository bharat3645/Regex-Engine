<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Compliance Manager</title>
    <link href="src/style.css" rel="stylesheet">
</head>

<body>
<div id="settingsModal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
        <div class="modal-header">
            <h2>Application Settings</h2>
            <button id="closeSettingsBtn" class="close-btn">&times;</button>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label for="rootDirInput">Scan Directory</label>
                <input type="text" id="rootDirInput" placeholder="e.g., C:\Users\YourUser\Documents">
            </div>
            <div class="form-group">
                <label for="rulesDirInput">Rules Directory</label>
                <input type="text" id="rulesDirInput" placeholder="./compliance_rules">
            </div>
            <div class="form-group">
                <label for="outputFileInput">Report File Name</label>
                <input type="text" id="outputFileInput" placeholder="violations_report.json">
            </div>
            <hr />
            <div class="form-group">
                <label for="scannerWorkersInput">Scanner Workers (CPU Intensive)</label>
                <input type="number" id="scannerWorkersInput" min="1" placeholder="e.g., 8">
            </div>
            <div class="form-group">
                <label for="extractorWorkersInput">Extractor Workers (I/O Intensive)</label>
                <input type="number" id="extractorWorkersInput" min="1" placeholder="e.g., 4">
            </div>
            <div class="form-group">
                <label for="maxCpuInput">Max CPU Usage (%)</label>
                <input type="number" id="maxCpuInput" min="1" max="100" placeholder="e.g., 80">
            </div>
            <div class="form-group">
                <label for="logLevelInput">Log Level</label>
                <select id="logLevelInput">
                    <option value="DEBUG">Debug</option>
                    <option value="INFO">Info</option>
                    <option value="WARN">Warn</option>
                    <option value="ERROR">Error</option>
                </select>
            </div>
            <div class="form-group">
                <label for="pipelineBufferInput">Pipeline Queue Size</label>
                <input type="number" id="pipelineBufferInput" min="1" placeholder="e.g., 1000">
            </div>
            <div class="form-group">
                <label for="discoveryBatchSizeInput">Discovery DB Batch Size</label>
                <input type="number" id="discoveryBatchSizeInput" min="1" placeholder="e.g., 500">
            </div>
            <div class="form-group">
                <label for="scannerBufferInput">Scanner Read Buffer (MB)</label>
                <input type="number" id="scannerBufferInput" min="1" placeholder="e.g., 4">
            </div>
            <div class="form-group">
                <label for="gcTriggerInput">Memory GC Trigger (MB)</label>
                <input type="number" id="gcTriggerInput" min="1" placeholder="e.g., 1024">
            </div>
            <div class="form-group">
                <label for="maxFileSizeInput">Max File Size to Scan (MB)</label>
                <input type="number" id="maxFileSizeInput" min="1" placeholder="e.g., 500">
            </div>
        </div>
        <div class="modal-footer">
            <button id="saveSettingsBtn">Save Changes</button>
        </div>
    </div>
</div>

<!-- Main Application Layout -->
<div class="container">
    <header>
        <div class="title-container">
            <h1>Compliance Manager RegeX</h1>
            <!-- NEW: Navigation Tabs -->
            <div class="nav-tabs">
                <button id="tabDashboard" class="nav-tab active">Dashboard</button>
                <button id="tabTree" class="nav-tab">Infrastructure Map</button>
            </div>
        </div>
        <!-- UPDATED HEADER CONTROLS -->
        <div class="header-controls">
            <div class="toggle-switch-container">
                <label for="ocrToggle" class="toggle-label">Scan Image PDFs (OCR)</label>
                <label class="switch">
                    <input type="checkbox" id="ocrToggle">
                    <span class="slider round"></span>
                </label>
            </div>
            <div class="header-buttons">
                <button id="settingsBtn" class="secondary-btn">Settings</button>
            </div>
        </div>
    </header>

    <!-- VIEW: DASHBOARD -->
    <div id="dashboardView" class="view-container active">
        <main class="bento-grid">
            <div class="bento-card" style="grid-area: progress;">
                <h2>Scan Progress</h2>
                <div class="progress-bar-container">
                    <div id="progressBar" class="progress-bar"></div>
                </div>
                <div class="progress-details">
                    <span id="progressPercent">0.0%</span>
                    <span id="progressFiles">0 / 0 Files</span>
                </div>
                <p id="progressText">Status: Idle</p>
            </div>

            <div class="bento-card" style="grid-area: control;">
                <button id="scanBtn" class="primary-btn">Start Scan</button>
                <button id="pauseBtn" class="warning-btn" style="display: none;">Pause Scan</button>
                <button id="stopBtn" class="danger-btn" style="display: none;">Stop Scan</button>
            </div>

            <div class="bento-card card-stat" style="grid-area: cpu;">
                <div class="stat-header"><h3>CPU Usage</h3></div>
                <div class="circular-progress">
                    <svg viewBox="0 0 100 100">
                        <circle class="progress-ring__circle-bg" stroke-width="8" fill="transparent" r="46" cx="50" cy="50"/>
                        <circle id="cpu-circle" class="progress-ring__circle" stroke-width="8" fill="transparent" r="46" cx="50" cy="50"/>
                    </svg>
                    <span id="cpuUsage" class="progress-value">--%</span>
                </div>
            </div>
            <div class="bento-card card-stat" style="grid-area: ram;">
                <div class="stat-header"><h3>RAM Usage</h3></div>
                <div class="circular-progress">
                    <svg viewBox="0 0 100 100">
                        <circle class="progress-ring__circle-bg" stroke-width="8" fill="transparent" r="46" cx="50" cy="50"/>
                        <circle id="ram-circle" class="progress-ring__circle" stroke-width="8" fill="transparent" r="46" cx="50" cy="50"/>
                    </svg>
                    <span id="ramUsage" class="progress-value">-- GB</span>
                </div>
            </div>

            <div class="bento-card card-stat-small" style="grid-area: disk_read;">
                <h3>Disk Read</h3>
                <p id="diskRead">-- MB/s</p>
            </div>
            <div class="bento-card card-stat-small" style="grid-area: disk_write;">
                <h3>Disk Write</h3>
                <p id="diskWrite">-- MB/s</p>
            </div>
            <div class="bento-card card-stat-small" style="grid-area: queue;">
                <h3>Queued Files</h3>
                <p id="queueDepth">--</p>
            </div>
            <div class="bento-card card-stat-small" style="grid-area: time;">
                <h3>Time Elapsed</h3>
                <p id="timeElapsed">0s</p>
            </div>

            <div class="bento-card" style="grid-area: logs;">
                <div class="log-header"><h2>Live Logs</h2></div>
                <div class="log-content" id="logContent"></div>
            </div>
        </main>
    </div>

    <!-- VIEW: TREE MAP -->
    <div id="treeView" class="view-container" style="display: none;">
        <div class="tree-container bento-card">
            <div class="tree-header">
                <h2>Infrastructure Lineage Map</h2>
                <div class="tree-legend">
                    <span class="legend-item"><span class="dot safe"></span> Safe</span>
                    <span class="legend-item"><span class="dot risk"></span> PII Risk</span>
                    <span class="legend-item"><span class="dot duplicate"></span> CopyOf</span>
                </div>
            </div>
            <div id="treeRoot" class="tree-content">
                <!-- Tree nodes will be injected here -->
                <p class="loading-text">Loading Infrastructure...</p>
            </div>
        </div>
    </div>
</div>
<script type="module" src="main.js"></script>
</body>
</html>
