// File: ocr/ocr.proto

syntax = "proto3";

package ocr;

option go_package = "./ocr";

// The OCR service definition.
service OCRService {
  // Sends a PDF file path for OCR processing and returns the extracted text.
  rpc ProcessPdf(OCRRequest) returns (OCRResponse) {}
}

// The request message containing the file path.
message OCRRequest {
  string file_path = 1;
}

// The response message containing the extracted text or an error.
message OCRResponse {
  string extracted_text = 1;
  string error = 2;
}
